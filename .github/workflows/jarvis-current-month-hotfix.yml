name: JARVIS current month hotfix

on:
  push:
    paths:
      - '.github/workflows/jarvis-current-month-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current-month behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v7.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("const ym=$('shiftMonth')?.value||'2026-08'", "const ym=$('shiftMonth')?.value||isoLocal(new Date()).slice(0,7)"),
              ("a.status==='出勤'&&a.date.startsWith('2026-08')", "a.status==='出勤'&&a.date.startsWith(isoLocal(new Date()).slice(0,7))"),
              ("else if(x==='○'||x==='〇'){status='出勤';work='○'}", "else if(['○','〇','A'].includes(String(x).toUpperCase())){status='出勤';work='○'}"),
              ("。8月粗利 ${yen(monthGross)}", "。${new Date().getMonth()+1}月粗利 ${yen(monthGross)}"),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('No matching hotfix patterns found')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'JARVIS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v7.js
          git commit -m 'Make JARVIS shift month dynamic and accept A code'
          git push
