<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020711">
  <title>JARVIS V7.0.9 運用強化版</title>
</head>
<body style="margin:0;background:#020711;color:#dff6ff;font-family:system-ui,sans-serif">
  <div id="boot" style="padding:24px">JARVIS V7.0.9 を起動しています…</div>
  <script>
  (async function(){
    try{
      const response=await fetch('./v7.html?stable=20260904-0031',{cache:'no-store'});
      if(!response.ok) throw new Error('v7.html '+response.status);
      let source=await response.text();
      source=source.replace(/V7\.0\.6 統合運用版/g,'V7.0.9 運用強化版');
      source=source.replace(/v7\.0\.6 統合運用版/g,'v7.0.9 運用強化版');
      const patchTag=[
        './jarvis-date-sync.js?v=20260903-0135',
        './workbook-hotfix.js?v=20260903-0135',
        './google-master-hotfix.js?v=20260904-1825',
        './jarvis-month-history-fix.js?v=20260903-2327',
        './jarvis-hide-logistics-columns.js?v=20260903-0135',
        './jarvis-akiyama-pricing.js?v=20260903-0135',
        './jarvis-all-sites.js?v=20260903-2238',
        './jarvis-source-dashboard.js?v=20260903-0135',
        './jarvis-current-month.js?v=20260904-1825',
        './jarvis-source-current-month-fix.js?v=20260903-2027',
        './jarvis-voice-ai.js?v=20260904-1305',
        './jarvis-neon-ui.js?v=20260903-1551',
        './jarvis-ops-hardening.js?v=20260904-0031'
      ].map(src=>'<script src="'+src+'"><\/script>').join('');
      source=source.replace('</body>',patchTag+'</body>');
      document.open();
      document.write(source);
      document.close();
    }catch(error){
      console.error(error);
      document.getElementById('boot').innerHTML='<b>JARVIS 起動エラー</b><br>'+String(error?.message||error);
    }
  })();
  </script>
</body>
</html>
