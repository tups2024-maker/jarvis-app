<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020711">
  <title>アップズ君 V7.0.22 統括AI</title>
  <script>
    (()=>{
      const q=new URLSearchParams(location.search);
      const forceMobile=q.get('mobile')==='1';
      const forceFull=q.get('full')==='1';
      const ua=navigator.userAgent||'';
      const isiPhone=/iPhone|iPod/.test(ua);
      const isiPad=/iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      const small=matchMedia('(max-width:900px)').matches;
      if(forceFull){location.replace('./v7.html?full=20260911-1236');return;}
      if(forceMobile||isiPhone||isiPad||small){location.replace('./mobile-live.html?v=20260911-1236');return;}
      location.replace('./desktop-live.html?v=20260911-1236');
    })();
  </script>
</head>
<body style="margin:0;background:#020711;color:#dff6ff;font-family:system-ui,sans-serif;padding:24px">アップズ君を起動しています…</body>
</html>
