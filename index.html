<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020711">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="./manifest.json?v=20260905-1750">
  <link rel="icon" href="./jarvis-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./jarvis-icon.svg">
  <title>JARVIS V7.0.16 PC/モバイル自動切替版</title>
  <script>
    (()=>{
      const q=new URLSearchParams(location.search);
      const forceDesktop=q.get('desktop')==='1';
      const forceMobile=q.get('mobile')==='1';
      const ua=navigator.userAgent||'';
      const isiPhone=/iPhone|iPod/.test(ua);
      const isiPad=/iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      const small=matchMedia('(max-width:900px)').matches;
      if(!forceDesktop&&(forceMobile||isiPhone||isiPad||small)){
        location.replace('./mobile.html?v=20260905-1750');
      }
    })();
  </script>
</head>
<body style="margin:0;background:#020711;color:#dff6ff;font-family:system-ui,sans-serif">
  <div id="boot" style="padding:24px">JARVIS PC版を起動しています…</div>
  <script>
  (async function(){
    try{
      const stamp='20260905-1750';
      const response=await fetch('./v7.html?auto='+stamp,{cache:'no-store'});
      if(!response.ok) throw new Error('v7.html '+response.status);
      let source=await response.text();
      source=source.replace(/V7\.0\.6 統合運用版/g,'V7.0.16 PCフル版');
      source=source.replace(/v7\.0\.6 統合運用版/g,'v7.0.16 PCフル版');
      const bootstrap=`<script>
      (()=>{
        const loaded=new Set();
        const load=(src)=>new Promise(resolve=>{if(loaded.has(src)){resolve();return;}loaded.add(src);const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'auto=${stamp}';s.async=false;s.onload=()=>resolve();s.onerror=()=>resolve();document.body.appendChild(s);});
        const wait=ms=>new Promise(r=>setTimeout(r,ms));
        const idle=fn=>('requestIdleCallback' in window?requestIdleCallback(fn,{timeout:1500}):setTimeout(fn,250));
        async function boot(){
          await load('./jarvis-openai-chat.js');
          await wait(250); await load('./jarvis-operating-system.js');
          await wait(450); await load('./jarvis-date-sync.js'); await load('./jarvis-current-month.js'); await load('./jarvis-source-current-month-fix.js'); await load('./jarvis-all-sites.js');
          await wait(650); await load('./workbook-hotfix.js'); await load('./google-master-hotfix.js'); await load('./jarvis-month-history-fix.js'); await load('./jarvis-hide-logistics-columns.js'); await load('./jarvis-akiyama-pricing.js');
          await wait(800); await load('./jarvis-source-dashboard.js'); await load('./jarvis-tax-mom.js'); await load('./jarvis-accounting-links.js'); await load('./jarvis-delivery-quality-guard.js');
          idle(async()=>{await load('./jarvis-voice-ai.js');await wait(350);await load('./jarvis-neon-ui.js');await wait(350);await load('./jarvis-ops-hardening.js');document.documentElement.dataset.jarvisFullAuto='ready';window.dispatchEvent(new CustomEvent('jarvis-full-auto-ready'));});
        }
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
      })();
      <\/script>`;
      source=source.replace('</body>',bootstrap+'</body>');
      document.open();document.write(source);document.close();
    }catch(error){console.error(error);document.getElementById('boot').innerHTML='<b>JARVIS 起動エラー</b><br>'+String(error?.message||error);}
  })();
  </script>
</body>
</html>
