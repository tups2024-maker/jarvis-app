<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020711">
  <title>JARVIS V7.0.10 統括自動化版</title>
</head>
<body style="margin:0;background:#020711;color:#dff6ff;font-family:system-ui,sans-serif">
  <div id="boot" style="padding:24px">JARVIS V7.0.10 を安全モードで起動しています…</div>
  <script>
  (async function(){
    try{
      const response=await fetch('./v7.html?safe=20260905-1702',{cache:'no-store'});
      if(!response.ok) throw new Error('v7.html '+response.status);
      let source=await response.text();
      source=source.replace(/V7\.0\.6 統合運用版/g,'V7.0.10 統括自動化版');
      source=source.replace(/v7\.0\.6 統合運用版/g,'v7.0.10 統括自動化版');

      // 安定性優先: まず本体 + OpenAIチャットのみ起動。
      // 追加パッチは応答停止の原因切り分け後に段階的に戻す。
      const patchTag=[
        './jarvis-openai-chat.js?v=20260905-1702'
      ].map(src=>'<script src="'+src+'"><\/script>').join('');

      source=source.replace('</body>',patchTag+'</body>');
      document.open();
      document.write(source);
      document.close();
    }catch(error){
      console.error(error);
      document.getElementById('boot').innerHTML='<b>JARVIS 起動エラー</b><br>'+String(error?.message||error);
    }
  })();
  </script>
</body>
</html>
